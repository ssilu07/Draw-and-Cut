plugins {
    id 'com.android.application'
}

android {
    namespace 'com.royals.drawandcut'
    compileSdk 36

    defaultConfig {
        applicationId "com.royals.drawandcut"
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "1.3"
    }

    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
            buildConfigField "String", "BANNER_AD_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "INTERSTITIAL_AD_ID", "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "REWARDED_AD_ID", "\"ca-app-pub-3940256099942544/5224354917\""
        }
        prod {
            dimension "environment"
            resValue "string", "admob_app_id", "ca-app-pub-1811294933992844~1152886483"
            buildConfigField "String", "BANNER_AD_ID", "\"ca-app-pub-1811294933992844/8601813271\""
            buildConfigField "String", "INTERSTITIAL_AD_ID", "\"ca-app-pub-1811294933992844/3980041986\""
            buildConfigField "String", "REWARDED_AD_ID", "\"ca-app-pub-1811294933992844/9524224731\""
        }
    }

    signingConfigs {
        debug {
            // uses default debug keystore automatically
        }
        release {
            def ksPath = System.getenv("KEYSTORE_FILE") ?: (project.hasProperty("KEYSTORE_FILE") ? project.property("KEYSTORE_FILE") : (file("keystore/release.keystore").exists() ? "keystore/release.keystore" : "D:/java/Key/drawandcut.jks"))
            def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty("KEYSTORE_PASSWORD") ? project.property("KEYSTORE_PASSWORD") : "8750257510")
            def kAlias = System.getenv("KEY_ALIAS") ?: (project.hasProperty("KEY_ALIAS") ? project.property("KEY_ALIAS") : "key0")
            def kPass = System.getenv("KEY_PASSWORD") ?: (project.hasProperty("KEY_PASSWORD") ? project.property("KEY_PASSWORD") : "8750257510")

            if (file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            minifyEnabled false
        }
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
}
